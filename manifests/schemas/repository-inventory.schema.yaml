# JSON Schema (Draft-07) for TBOX Build Repository Inventory (CR-004 D1)
# Validates manifests/repository-inventory.yaml
#
# Field policy (CR-004 §4):
#   - repositories: the authoritative, explicitly declared repository scan
#     set. Coverage validation never relies on a hard-coded sibling glob.
#   - coverage_allowlist[]: reviewed exceptions for repositories that ship
#     unit/install evidence but are not (yet) registered services. Every
#     entry MUST record owner, reason, and an expiry or review condition
#     (BUILD-REQ-045). Expired entries fail validation. Generic patterns
#     and permanent ownerless exemptions are rejected by the parser.
#   - repositories[].empty_components: post-install content-production
#     exceptions (CR-004 §4.4); a component may legitimately install no
#     files without being treated as missing coverage.
$schema: "http://json-schema.org/draft-07/schema#"
title: TBOX Build Repository Inventory
type: object
required:
  - version
  - repositories
additionalProperties: false
properties:
  version:
    type: integer
    minimum: 1
  repositories:
    type: object
    minProperties: 1
    additionalProperties: false
    patternProperties:
      "^[a-z][a-z0-9-]*$":
        type: object
        required:
          - path
        additionalProperties: false
        properties:
          path:
            type: string
            minLength: 1
          description:
            type: string
          empty_components:
            type: array
            items:
              type: string
              minLength: 1
  coverage_allowlist:
    type: array
    items:
      type: object
      required:
        - repository
        - owner
        - reason
      additionalProperties: false
      anyOf:
        - required:
            - expires
        - required:
            - review_by
      properties:
        repository:
          type: string
          minLength: 1
        owner:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        expires:
          type: string
        review_by:
          type: string
        milestone:
          type: string
