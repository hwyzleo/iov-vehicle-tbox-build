# JSON Schema (Draft-07) for TBOX Build Link-Hardening Exemptions (CR-004 D2 §5.4)
# Validates manifests/link-exemptions.yaml
#
# Field policy (CR-004 §5.4, BUILD-REQ-046):
#   - every exemption MUST record target, owner, reason, unresolved-symbol
#     class, risk, scope, and removal condition in reviewed design/CR
#     evidence;
#   - repository-wide silent overrides are forbidden; only named targets may
#     be exempted via the tbox_link_hardening_exempt(<target>) helper;
#   - static archives are not directly exempted (their unresolved references
#     are evaluated when linked into a final ELF).
$schema: "http://json-schema.org/draft-07/schema#"
title: TBOX Build Link-Hardening Exemptions
type: object
required:
  - version
  - exemptions
additionalProperties: false
properties:
  version:
    type: integer
    minimum: 1
  exemptions:
    type: array
    items:
      type: object
      required:
        - target
        - owner
        - reason
        - symbol_class
        - risk
        - scope
        - removal_condition
      additionalProperties: false
      properties:
        target:
          type: string
          minLength: 1
        owner:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        symbol_class:
          type: string
          minLength: 1
        risk:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
        removal_condition:
          type: string
          minLength: 1
