# TBOX Build Service Manifest
# Built-in minimal example services (CR-001) plus the framework library
# entry (CR-002). Dependency fields use the explicit service_dependencies
# / target_dependencies split; install_components use {name, staging}.
# PROV service entry added by TBOX-PROV-DSN-CR-009.
# SEC service entry added by TBOX-SEC-DSN-CR-012.

services:
  tbox-hello-lib:
    description: "Minimal C++ shared library for BUILD v0.1-alpha self-verification"
    kind: library
    repository: examples/minimal
    build:
      targets:
        - tbox-hello-lib
      service_dependencies: []
      target_dependencies: []
      preset: orin-release
      install_components:
        - name: tbox-hello-lib-runtime
          staging: rootfs
    runtime:
      config_paths: []
      persistent_paths: []

  tbox-hello-cli:
    description: "Minimal C++ executable consuming tbox-hello-lib"
    kind: service
    repository: examples/minimal
    build:
      targets:
        - tbox-hello-cli
      service_dependencies:
        - tbox-hello-lib
      target_dependencies: []
      preset: orin-release
      install_components:
        - name: tbox-hello-cli-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-hello.service
      after: []
      health_check: tests/smoke/hello-health.sh
      smoke_test: tests/smoke/hello-ipc.sh
      config_paths:
        - /etc/tbox/hello
      persistent_paths:
        - /var/lib/tbox/hello
      required_devices: []
      capabilities: []

  framework:
    description: "TBOX framework public library (config/store/log/ipc/hash/application)"
    kind: library
    source_dir: ../iov-vehicle-tbox-framework
    build:
      preset: orin-release
      targets:
        - framework-config
        - framework-store
        - framework-log
        - framework-ipc
        - framework-hash
        - framework-application
      install_components:
        - name: framework-sdk
          staging: sdk
        - name: framework-runtime
          staging: rootfs
      service_dependencies: []
      target_dependencies:
        - yaml-cpp
    runtime:
      systemd_units: []

  prov:
    description: "TBOX provisioning service (first real service pilot, CR-009)"
    kind: service
    source_dir: ../iov-vehicle-tbox-prov
    build:
      preset: orin-release
      targets:
        - tbox_prov
        - tbox_prov_client
      service_dependencies:
        - framework
      target_dependencies:
        - nlohmann-json
      install_components:
        - name: prov-sdk
          staging: sdk
        - name: prov-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-prov.service
      after: []
      health_check: tests/smoke/prov-health.sh
      smoke_test: tests/smoke/prov-ipc.sh
      config_paths:
        - /etc/tbox/common.yaml
        - /etc/tbox/conf.d/prov.yaml
      config_validation:
        target_path: /etc/tbox/conf.d/prov.yaml
        default_source: config/prov.default.yaml
      persistent_paths:
        - /var/tbox/prov
      required_devices: []
      capabilities: []

  time:
    description: "TBOX time service (TBOX-TIME-DSN-CR-001: tbox_time daemon + tbox::time_client SDK; TBOX-SEC-DSN-CR-024 正式 SDK 制品)"
    kind: service
    source_dir: ../iov-vehicle-tbox-time
    build:
      preset: orin-release
      targets:
        - tbox_time
        - tbox-time-lib
      service_dependencies:
        - framework
      target_dependencies:
        - nlohmann-json
      # system-observe 后端经 sd-bus 读 systemd-timesyncd 的 NTP 证据
      # （TBOX-TIME-DSN-CR-002）。libsystemd 来自 sysroot 受控 dev 增补，
      # 不走 TARGET 依赖配方。强制要求可用：缺 sd-bus 时宁可 configure 失败，
      # 也不接受「构建全绿但 SystemObserverSource 恒 Unsupported」的 daemon。
      cmake_cache_variables:
        TBOX_TIME_REQUIRE_SDBUS: "ON"
      install_components:
        - name: time-sdk
          staging: sdk
        - name: time-runtime
          staging: rootfs
    runtime:
      systemd_units:
        # unit 契约名（沿用 tbox-prov/sec/mqtt 命名惯例，TBOX-BUILD-DSN-CR-006 §3）。
        # unit 文件由 TIME 仓库配套交付（install COMPONENT time-runtime ->
        # lib/systemd/system）；BUILD 打包校验强制锁定版本实际安装该 unit，
        # 缺失即明确失败，不以仅登记名称代替实际文件（CR-006 §3.3）。
        - tbox-time.service
      # TIME 只依赖 framework library（无 unit），自身无启动顺序约束登记；
      # 禁止引用不存在的 tbox-framework.service，也禁止 after MQTT/TSP/SEC unit
      # （授时引导回边，validator 断言拒绝，CR-006 §3.1/§3.2）。
      after: []
      config_paths:
        - /etc/tbox/common.yaml
        # 正式契约路径（与 conf.d/*.yaml 部署策略一致）：TIME 当前代码盘点结果
        # 读 /etc/tbox/time.yaml（临时开发路径），正式接入由 TIME 配套适配
        # conf.d 默认模板安装与 loader（跨仓缺口登记，不以 BUILD overlay 固化例外）。
        - /etc/tbox/conf.d/time.yaml
      config_validation:
        target_path: /etc/tbox/conf.d/time.yaml
        # production 模板（config/time.yaml 为 test/mock 冒烟配置，不作正式默认）
        default_source: config/time.example.yaml
      # TBOX-TIME-DSN-CR-002：TIME 转为系统时钟观测方，只读 adjtimex + sd-bus，
      # 不再写系统时钟（timesyncd 是合法写入方），故不授予任何能力。
      capabilities: []
      persistent_paths: []
      required_devices: []

  sec:
    description: "TBOX security service (CR-012: tbox_sec daemon + tbox::sec_client SDK; CR-024: TIME client 依赖 + 只读可信时间 IPC/SDK)"
    kind: service
    source_dir: ../iov-vehicle-tbox-sec
    build:
      preset: orin-release
      targets:
        - tbox_sec
        - tbox_sec_client
        - sec_config_checker
      service_dependencies:
        - framework
        - prov
        - time
      # curl: SEC 直接 TARGET 依赖（cloud_client 证书注入/CSR 提交；OpenSSL 来自 sysroot）
      target_dependencies:
        - curl
      install_components:
        - name: sec-sdk
          staging: sdk
        - name: sec-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-sec.service
      # SEC 启动时经 framework-ipc 连接 tbox-prov.sock（IpcProvService::initialize），
      # PROV 未就绪则 initialize 失败，故登记真实启动顺序依赖。
      # TBOX-SEC-DSN-CR-024：SEC 消费 tbox::time_client（只读可信时间 IPC），
      # TIME 未运行不阻塞 SEC 非时间能力（不生成 Requires）；以 After= 表达真实
      # 启动偏序（CR-006 §3.2：保留 PROV 并增加 TIME 实际 unit，不用 waiver 掩盖）。
      after:
        - tbox-prov.service
        - tbox-time.service
      health_check: tests/smoke/sec-health.sh
      smoke_test: tests/smoke/sec-security.sh
      config_paths:
        - /etc/tbox/common.yaml
        - /etc/tbox/conf.d/sec.yaml
      config_validation:
        target_path: /etc/tbox/conf.d/sec.yaml
        default_source: config/sec.default.yaml
      persistent_paths:
        - /var/tbox/sec
      required_devices: []
      capabilities: []

  # DIAG service entry: 补齐 DIAG 的正式发布链路。
  # 此前 DIAG 未登记 service，也未声明 install component，BUILD 无法把
  # tbox_diag / tbox-diag.service / conf.d/diag.yaml staging 进 rootfs，
  # 设备只能沿用遗留单体产物 /opt/tbox/bin/diag（+ /opt/tbox/lib/libhwyz.so），
  # 该产物不由任何现行 install 规则生成。
  diag:
    description: "TBOX diagnostic service (UDS/DoIP server; routes to PROV/SEC)"
    kind: service
    source_dir: ../iov-vehicle-tbox-diag
    build:
      preset: orin-release
      targets:
        - TboxDiagService
        - tbox_diag_client
      # DIAG 启动时经 framework-ipc 连接 PROV 与 SEC，且链接 tbox::prov_client /
      # tbox::sec_client（冻结 release-set SDK）；framework 是 library（无 unit）。
      # time: 仅构建期依赖。diag/CMakeLists.txt:53 用
      # add_subdirectory(../iov-vehicle-tbox-sec) 在自己的构建树里编译 SEC，
      # 因此 SEC 的 find_package(TboxTimeClient CONFIG REQUIRED)（SEC
      # CMakeLists.txt:60）必须在 diag configure 阶段就能解析，需要 sdk/time
      # 进入 diag 的 CMAKE_PREFIX_PATH。DIAG 运行期不与 TIME 通信，故以
      # after_waiver 如实表达（根因是 diag 的跨仓 add_subdirectory 违反
      # 「禁止 add_subdirectory」约定，待 diag 侧改为 find_package 后移除本条）。
      service_dependencies:
        - framework
        - prov
        - sec
        - time
      target_dependencies:
        - nlohmann-json
      install_components:
        - name: diag-sdk
          staging: sdk
        - name: diag-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-diag.service
      # main.cpp 中 prov_client->connect() / sec_client->connect() 失败即 return 1，
      # 故登记真实启动顺序依赖。
      after:
        - tbox-prov.service
        - tbox-sec.service
      # time 是构建期依赖（见上方 service_dependencies 注释）：DIAG 运行期
      # 不连接 TIME，不生成 After=tbox-time.service，以免引入虚假启动偏序。
      after_waivers:
        - dependency: time
          unit: tbox-time.service
          owner: diag
          reason: >-
            Build-time only dependency: diag compiles SEC in its own build tree
            via add_subdirectory (diag/CMakeLists.txt:53), so SEC's
            find_package(TboxTimeClient) must resolve at diag configure time.
            DIAG performs no runtime IPC to TIME.
      health_check: tests/smoke/diag-health.sh
      smoke_test: tests/smoke/diag-ipc.sh
      config_paths:
        - /etc/tbox/common.yaml
        - /etc/tbox/conf.d/diag.yaml
      config_validation:
        target_path: /etc/tbox/conf.d/diag.yaml
        default_source: config/diag.default.yaml
      persistent_paths:
        - /var/tbox
      required_devices: []
      capabilities: []

  mqtt:
    description: "TBOX MQTT service (CR-011: tbox_mqtt daemon + tbox::mqtt_client SDK)"
    kind: service
    source_dir: ../iov-vehicle-tbox-mqtt
    build:
      preset: orin-release
      targets:
        - tbox_mqtt_service
        - tbox_mqtt_client
      service_dependencies:
        - framework
        - prov
        - sec
      target_dependencies:
        - mosquitto
      install_components:
        - name: mqtt-sdk
          staging: sdk
        - name: mqtt-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-mqtt.service
      # MQTT 启动时经 framework-ipc 连接 tbox-prov.sock 与 tbox-sec.sock
      # （身份绑定 + profile=mqtt 的 TLS 凭据）。与 SEC/DIAG 不同，连接失败
      # 不会让 initialize 返回 false，而是降级进入 PROV_WAIT / CERT_WAIT
      # （MQTT-1009 / MQTT-1001）并保持本地 IPC 可用，因此不得生成
      # Requires=；但这是真实启动顺序依赖，必须登记为 after。
      after:
        - tbox-prov.service
        - tbox-sec.service
      health_check: tests/smoke/mqtt-health.sh
      smoke_test: tests/smoke/mqtt-broker.sh
      config_paths:
        - /etc/tbox/common.yaml
        - /etc/tbox/conf.d/mqtt.yaml
      config_validation:
        target_path: /etc/tbox/conf.d/mqtt.yaml
        default_source: config/mqtt.default.yaml
      persistent_paths:
        - /var/lib/tbox
        - /var/tbox/mqtt
      capabilities: []

  tsp:
    description: "TBOX TSP service (CR-007: tbox_tsp daemon + tbox::tsp_client SDK)"
    kind: service
    source_dir: ../iov-vehicle-tbox-tsp
    build:
      preset: orin-release
      targets:
        - tbox_tsp
        - tbox_tsp_client
      # CR-007 §8: framework 是 library（无 unit）；TSP 消费 tbox::mqtt_client。
      # TBOX-TSP-DSN-CR-010 §3.2 / TBOX-SEC-DSN-CR-019: TSP 新增直接消费
      # tbox::sec_client（V2C keyprov 业务密钥状态查询 + Wrapped Key 原子导入），
      # 其 CMakeLists.txt 对 TboxSecClient 为 CONFIG REQUIRED，故 sec 必须登记为
      # 直接 service dependency（否则 SDK 不进 prefix_path，configure 失败）。
      # PROV 仍仅由 MQTT/SEC 构建闭包带入，不登记为 TSP 直接依赖。
      service_dependencies:
        - framework
        - sec
        - mqtt
      # protobuf: TSP 自备 proto（proto/vehicle/common/v1/envelope.proto）并经
      # pkg_check_modules(protobuf) 链接 TARGET runtime（CR-009）。
      target_dependencies:
        - nlohmann-json
        - protobuf
      install_components:
        - name: tsp-sdk
          staging: sdk
        - name: tsp-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-tsp.service
      # TSP 在 MQTT 不可用时允许 DEGRADED 提供本地 IPC，不得自动生成 Requires=MQTT（BUILD-REQ-051）。
      # 该依赖为真实 service 依赖但刻意不建立 ordering，故以结构化豁免显式登记，
      # 豁免不进入 ordering graph，也不生成 After=tbox-mqtt.service。
      #
      # SEC 则登记真实 ordering：TSP 的 keyprov 适配器在每次业务调用前惰性重连
      # （sec_business_key_adapter.cpp:48/58/67），SEC 缺失时 keyprov 保持 NOT_READY
      # 不阻塞启动，但 SEC 是真实运行期依赖，按 someip 先例登记 After= 以减少启动抖动。
      after:
        - tbox-sec.service
      after_waivers:
        - dependency: mqtt
          unit: tbox-mqtt.service
          owner: tsp
          reason: TSP supports DEGRADED local IPC when MQTT is unavailable
      health_check: tests/smoke/tsp-health.sh
      smoke_test: tests/smoke/tsp-fota-relay.sh
      config_paths:
        - /etc/tbox/common.yaml
        - /etc/tbox/conf.d/tsp.yaml
      config_validation:
        target_path: /etc/tbox/conf.d/tsp.yaml
        default_source: config/tsp.default.yaml
      # framework-store open("tsp", "/var/tbox") -> /var/tbox/tsp/
      persistent_paths:
        - /var/tbox
      required_devices: []
      capabilities: []

  # SOMEIP service entry added by TBOX-SOMEIP-DSN-CR-006.
  # SOMEIP 是车内 SOME/IP 网络的唯一门面：对外 vsomeip/CommonAPI + SOME/IP-SD，
  # 对内经 tbox::tsp_client / tbox::prov_client 消费冻结 release-set SDK。
  # 只交付 someip-runtime（rootfs）；本期不新增 someip_client SDK / IPC Server。
  someip:
    description: "TBOX SOME/IP service (CR-006: in-vehicle SOME/IP facade bridged to TBOX domain clients)"
    kind: service
    source_dir: ../iov-vehicle-tbox-someip
    build:
      preset: orin-release
      targets:
        - tbox_someip
      # CR-006 §11.3：BUILD 注入 SOMEIP 构建开关（受控输入）：
      #   USE_REAL_IPC=ON  -> 链接 tbox::tsp_client / tbox::prov_client（冻结 SDK）
      #   USE_MOCK_SOMEIP=OFF -> 真实 vsomeip/CommonAPI runtime（非 mock）
      cmake_cache_variables:
        USE_REAL_IPC: "ON"
        USE_MOCK_SOMEIP: "OFF"
      # CR-006 §11.3：SOMEIP 消费 tbox::tsp_client / tbox::prov_client；
      # framework 是 library（无 unit）。MQTT/SEC 由 TSP/MQTT 闭包带入，不登记。
      service_dependencies:
        - framework
        - tsp
        - prov
      # CR-006 §11.4：TARGET vsomeip/CommonAPI runtime 来自受控 recipe/sysroot；
      # CommonAPI HOST generator 不在 target_dependencies（仅 HOST 执行，
      # 版本锁定记入 Artifact Manifest）。
      target_dependencies:
        - vsomeip
        - commonapi-core
        - commonapi-someip
        # protobuf: SOMEIP 自备 proto（proto/vehicle/common/v1/
        # vehicle_message_envelope.proto）并经 pkg_check_modules(protobuf)
        # 链接 TARGET runtime（CR-008）。HOST protoc 同为受控输入（Dockerfile）。
        - protobuf
      install_components:
        - name: someip-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-someip.service
      # CR-006 §7/§11.5：SOMEIP 作为 consumer 连接 TSP/PROV IPC socket，
      # 声明真实启动顺序；unit 内 Wants=network-online.target（非 Requires），
      # 依赖未就绪时延迟 Offer/暂不可用，不阻塞启动。
      after:
        - tbox-tsp.service
        - tbox-prov.service
      health_check: tests/smoke/someip-health.sh
      smoke_test: tests/smoke/someip-sd-smoke.sh
      config_paths:
        - /etc/tbox/common.yaml
        - /etc/tbox/conf.d/someip.yaml
        - /etc/tbox/someip/vsomeip.json
      config_validation:
        target_path: /etc/tbox/conf.d/someip.yaml
        default_source: config/someip.default.yaml
      persistent_paths: []
      required_devices: []
      capabilities: []
