# TBOX Build Service Manifest
# Built-in minimal example services (CR-001) plus the framework library
# entry (CR-002). Dependency fields use the explicit service_dependencies
# / target_dependencies split; install_components use {name, staging}.
# PROV service entry added by TBOX-PROV-DSN-CR-009.
# SEC service entry added by TBOX-SEC-DSN-CR-012.

services:
  tbox-hello-lib:
    description: "Minimal C++ shared library for BUILD v0.1-alpha self-verification"
    repository: examples/minimal
    build:
      targets:
        - tbox-hello-lib
      service_dependencies: []
      target_dependencies: []
      preset: orin-release
      install_components:
        - name: tbox-hello-lib-runtime
          staging: rootfs
    runtime:
      config_paths: []
      persistent_paths: []

  tbox-hello-cli:
    description: "Minimal C++ executable consuming tbox-hello-lib"
    repository: examples/minimal
    build:
      targets:
        - tbox-hello-cli
      service_dependencies:
        - tbox-hello-lib
      target_dependencies: []
      preset: orin-release
      install_components:
        - name: tbox-hello-cli-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-hello.service
      after: []
      health_check: tests/smoke/hello-health.sh
      smoke_test: tests/smoke/hello-ipc.sh
      config_paths:
        - /etc/tbox/hello
      persistent_paths:
        - /var/lib/tbox/hello
      required_devices: []
      capabilities: []

  framework:
    description: "TBOX framework public library (config/store/log/ipc/hash/application)"
    kind: library
    source_dir: ../iov-vehicle-tbox-framework
    build:
      preset: orin-release
      targets:
        - framework-config
        - framework-store
        - framework-log
        - framework-ipc
        - framework-hash
        - framework-application
      install_components:
        - name: framework-sdk
          staging: sdk
        - name: framework-runtime
          staging: rootfs
      service_dependencies: []
      target_dependencies:
        - yaml-cpp
    runtime:
      systemd_units: []

  prov:
    description: "TBOX provisioning service (first real service pilot, CR-009)"
    kind: service
    source_dir: ../iov-vehicle-tbox-prov
    build:
      preset: orin-release
      targets:
        - tbox_prov
        - tbox_prov_client
      service_dependencies:
        - framework
      target_dependencies:
        - nlohmann-json
      install_components:
        - name: prov-sdk
          staging: sdk
        - name: prov-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-prov.service
      after: []
      health_check: tests/smoke/prov-health.sh
      smoke_test: tests/smoke/prov-ipc.sh
      config_paths:
        - /etc/tbox/conf.d
      persistent_paths:
        - /var/tbox/prov
      required_devices: []
      capabilities: []

  sec:
    description: "TBOX security service (CR-012: tbox_sec daemon + tbox::sec_client SDK)"
    kind: service
    source_dir: ../iov-vehicle-tbox-sec
    build:
      preset: orin-release
      targets:
        - tbox_sec
        - tbox_sec_client
      service_dependencies:
        - framework
        - prov
      # curl: SEC 直接 TARGET 依赖（cloud_client 证书注入/CSR 提交；OpenSSL 来自 sysroot）
      target_dependencies:
        - curl
      install_components:
        - name: sec-sdk
          staging: sdk
        - name: sec-runtime
          staging: rootfs
    runtime:
      systemd_units:
        - tbox-sec.service
      # SEC 启动时经 framework-ipc 连接 tbox-prov.sock（IpcProvService::initialize），
      # PROV 未就绪则 initialize 失败，故登记真实启动顺序依赖。
      after:
        - tbox-prov.service
      health_check: tests/smoke/sec-health.sh
      smoke_test: tests/smoke/sec-security.sh
      config_paths:
        - /etc/tbox/conf.d
      persistent_paths:
        - /var/tbox/sec
      required_devices: []
      capabilities: []
