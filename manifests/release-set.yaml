# TBOX Build Release Set Manifest
# Built-in minimal release set (CR-001) plus the framework-only release
# set (CR-002). Framework + PROV pilot release set added by
# TBOX-PROV-DSN-CR-009.

release_sets:
  tbox-orin-minimal:
    description: "Minimal TBOX Orin release set for BUILD v0.1-alpha self-verification"
    platform: orin
    profile: release
    services:
      - tbox-hello-lib
      - tbox-hello-cli

  tbox-framework-orin:
    description: "Framework-only Orin release set (CR-002 first public dependency)"
    platform: orin
    profile: release
    services:
      - framework

  tbox-prov-orin:
    description: "Framework + PROV Orin release set (CR-009 first real service pilot)"
    platform: orin
    profile: release
    services:
      - framework
      - prov
