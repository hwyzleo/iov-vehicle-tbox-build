# TBOX Build Release Set Manifest
# Built-in minimal release set (CR-001) plus the framework-only release
# set (CR-002). Framework + PROV pilot release set added by
# TBOX-PROV-DSN-CR-009.

release_sets:
  tbox-orin-minimal:
    description: "Minimal TBOX Orin release set for BUILD v0.1-alpha self-verification"
    platform: orin
    profile: release
    services:
      - tbox-hello-lib
      - tbox-hello-cli

  tbox-framework-orin:
    description: "Framework-only Orin release set (CR-002 first public dependency)"
    platform: orin
    profile: release
    services:
      - framework

  tbox-prov-orin:
    description: "Framework + PROV Orin release set (CR-009 first real service pilot)"
    platform: orin
    profile: release
    services:
      - framework
      - prov

  tbox-sec-orin:
    description: "Framework + PROV + SEC Orin release set (TBOX-SEC-DSN-CR-012)"
    platform: orin
    profile: release
    services:
      - framework
      - prov
      - sec

  tbox-diag-orin:
    description: "Framework + PROV + SEC + DIAG Orin release set (DIAG 正式发布链路补齐)"
    platform: orin
    profile: release
    services:
      - framework
      - prov
      - sec
      - diag

  tbox-mqtt-orin:
    description: "Framework + PROV + SEC + MQTT Orin release set (TBOX-MQTT-DSN-CR-011)"
    platform: orin
    profile: release
    services:
      - framework
      - prov
      - sec
      - mqtt

  tbox-tsp-orin:
    description: "Framework + PROV + SEC + MQTT + TSP Orin release set (TBOX-TSP-DSN-CR-007)"
    platform: orin
    profile: release
    services:
      - framework
      - prov
      - sec
      - mqtt
      - tsp

  tbox-someip-orin:
    description: "Framework + PROV + SEC + DIAG + MQTT + TSP + SOMEIP Orin release set (full TBOX stack)"
    platform: orin
    profile: release
    services:
      - framework
      - prov
      - sec
      - diag
      - mqtt
      - tsp
      - someip
