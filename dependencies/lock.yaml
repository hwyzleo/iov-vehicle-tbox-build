# TBOX Build Dependency Lock File
# Records versions, sources, licenses, architecture, linkage and checksums
# for TARGET dependencies built by the recipe executor into TBOX_DEP_STAGING.
#
# Per CR-002: dependencies is a mapping keyed by dependency name.
# Source SHA-256 values marked PENDING must be filled after obtaining the
# controlled source; the recipe executor rejects PENDING entries for release
# builds.

dependencies:
  yaml-cpp:
    version: "0.8.0"
    source:
      url: "https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz"
      sha256: "fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16"
    license: BSD-3-Clause
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        YAML_CPP_BUILD_TESTS: "OFF"
        YAML_CPP_BUILD_TOOLS: "OFF"
        YAML_BUILD_SHARED_LIBS: "OFF"

  nlohmann-json:
    version: "3.11.2"
    source:
      url: "https://github.com/nlohmann/json/archive/refs/tags/v3.11.2.tar.gz"
      sha256: "d69f9deb6a75e2580465c6c4c5111b89c4dc2fa94e3a85fcd2ffcd9a143d9273"
    license: MIT
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        JSON_BuildTests: "OFF"

  curl:
    version: "7.68.0"
    source:
      url: "https://github.com/curl/curl/releases/download/curl-7_68_0/curl-7.68.0.tar.gz"
      # Orin sysroot 仅含 runtime libcurl.so.4（无 dev 头/软链/.pc），无法从 sysroot 解析；
      # 故按 TARGET 源码构建。SHA-256 由锁定 URL 实际产物计算并核验（4096350 bytes）@2026-08-03。
      sha256: "1dd7604e418b0b9a9077f62f763f6684c1b092a7bc17e3f354b8ad5c964d7358"
    license: curl (MIT-like)
    boundary: TARGET
    architecture: aarch64
    # static: 非系统自建 TARGET 库,静态链接进 SEC,避免与 base image libcurl.so.4.6.0 SONAME 冲突。
    # curl 的传递依赖 OpenSSL/zlib 仍动态链接(来自 sysroot,平台统管 ABI/安全更新)。
    linkage: static
    patches: []
    cmake:
      options:
        BUILD_CURL_EXE: "OFF"
        BUILD_TESTING: "OFF"
        CURL_USE_OPENSSL: "ON"
        BUILD_SHARED_LIBS: "OFF"
        BUILD_STATIC_LIBS: "ON"

  mosquitto:
    version: "2.0.20"
    source:
      url: "https://github.com/eclipse/mosquitto/archive/refs/tags/v2.0.20.tar.gz"
      sha256: "851fb4b5bf5e2ddc4c341efcfe24c877fcb3a4356c79838103a44751c5731f6a"
    license: EPL-2.0
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        WITH_BROKER: "OFF"
        WITH_CLIENTS: "OFF"
        WITH_TESTS: "OFF"
        # 2.0.20 的文档选项名为 DOCUMENTATION（非 WITH_DOCS）；置 OFF 避免
        # man/ 构建依赖 xsltproc 导致 configure 失败（CI 容器未安装 xsltproc）。
        DOCUMENTATION: "OFF"
        WITH_SHARED_LIBRARIES: "OFF"
        WITH_STATIC_LIBRARIES: "ON"
        WITH_CJSON: "OFF"
        WITH_SRV: "OFF"

cache:
  key_components:
    - platform_manifest_digest
    - toolchain_version
    - sysroot_digest
    - dependency_lock_digest
    - build_type
  directory: dependencies/cache/
