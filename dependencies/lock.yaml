# TBOX Build Dependency Lock File
# Records versions, sources, licenses, architecture, linkage and checksums
# for TARGET dependencies built by the recipe executor into TBOX_DEP_STAGING.
#
# Per CR-002: dependencies is a mapping keyed by dependency name.
# Source SHA-256 values marked PENDING must be filled after obtaining the
# controlled source; the recipe executor rejects PENDING entries for release
# builds.

dependencies:
  yaml-cpp:
    version: "0.8.0"
    source:
      url: "https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz"
      sha256: "fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16"
    license: BSD-3-Clause
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        YAML_CPP_BUILD_TESTS: "OFF"
        YAML_CPP_BUILD_TOOLS: "OFF"
        YAML_BUILD_SHARED_LIBS: "OFF"

  nlohmann-json:
    version: "3.11.2"
    source:
      url: "https://github.com/nlohmann/json/archive/refs/tags/v3.11.2.tar.gz"
      sha256: "d69f9deb6a75e2580465c6c4c5111b89c4dc2fa94e3a85fcd2ffcd9a143d9273"
    license: MIT
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        JSON_BuildTests: "OFF"

  curl:
    version: "7.68.0"
    source:
      url: "https://github.com/curl/curl/releases/download/curl-7_68_0/curl-7.68.0.tar.gz"
      # Orin sysroot 仅含 runtime libcurl.so.4（无 dev 头/软链/.pc），无法从 sysroot 解析；
      # 故按 TARGET 源码构建。SHA-256 由锁定 URL 实际产物计算并核验（4096350 bytes）@2026-08-03。
      sha256: "1dd7604e418b0b9a9077f62f763f6684c1b092a7bc17e3f354b8ad5c964d7358"
    license: curl (MIT-like)
    boundary: TARGET
    architecture: aarch64
    # static: 非系统自建 TARGET 库,静态链接进 SEC,避免与 base image libcurl.so.4.6.0 SONAME 冲突。
    # curl 的传递依赖 OpenSSL/zlib 仍动态链接(来自 sysroot,平台统管 ABI/安全更新)。
    linkage: static
    patches: []
    cmake:
      options:
        BUILD_CURL_EXE: "OFF"
        BUILD_TESTING: "OFF"
        CURL_USE_OPENSSL: "ON"
        BUILD_SHARED_LIBS: "OFF"
        BUILD_STATIC_LIBS: "ON"

  mosquitto:
    version: "2.0.20"
    source:
      url: "https://github.com/eclipse/mosquitto/archive/refs/tags/v2.0.20.tar.gz"
      sha256: "851fb4b5bf5e2ddc4c341efcfe24c877fcb3a4356c79838103a44751c5731f6a"
    license: EPL-2.0
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        WITH_BROKER: "OFF"
        WITH_CLIENTS: "OFF"
        WITH_TESTS: "OFF"
        # 2.0.20 的文档选项名为 DOCUMENTATION（非 WITH_DOCS）；置 OFF 避免
        # man/ 构建依赖 xsltproc 导致 configure 失败（CI 容器未安装 xsltproc）。
        DOCUMENTATION: "OFF"
        WITH_SHARED_LIBRARIES: "OFF"
        WITH_STATIC_LIBRARIES: "ON"
        WITH_CJSON: "OFF"
        WITH_SRV: "OFF"

  # ================================================================
  # SOME/IP 中间件（TBOX-SOMEIP-DSN-CR-006 §6.3/§11.4）
  #   TARGET：vsomeip + CommonAPI runtime（capicxx core / someip），
  #   来自受控 recipe，安装到 TBOX_DEP_STAGING；SOMEIP daemon 经
  #   pkg-config（vsomeip3 / CommonAPI / CommonAPI-SomeIP）消费。
  #   HOST：CommonAPI generator（commonapi-generator /
  #   commonapi-someip-generator，Java）不在本文件范围（仅 HOST 执行，
  #   版本锁定记入 Artifact Manifest）。
  #   SHA-256 均 PENDING：下载受控源码后计算填充；release build 前必须完成。
  # ================================================================
  vsomeip:
    version: "3.4.10"
    source:
      url: "https://github.com/COVESA/vsomeip/archive/refs/tags/3.4.10.tar.gz"
      # 3.1.20.3 -> 3.4.10。原因链：
      #  (1) commonapi-someip 3.2.3-r8 的 CMakeLists 要求 find_package(vsomeip3 3.2.0)，
      #      3.1.20.x 不满足（vsomeip 无 3.2.x tag：3.1.37.1 直接跳到 3.3.0）。
      #  (2) commonapi-someip 3.2.3-r8/master 的 ClientId.cpp 直接使用扁平结构
      #      vsomeip_sec_client_t.{user,group,host}；vsomeip 3.3.0/3.3.8 曾把该结构
      #      改成 union（.client.uds_client.*）导致编译失败，3.4.10 起又恢复为扁平结构。
      #  (3) 3.4.10 与 capicxx-someip 3.2.3-r8 同为 2023-10 发布，是官方配套版本；
      #      仍只需 Boost 1.55+/-std=c++14（适配 sysroot Boost 1.71.0 + gcc-9）。
      sha256: "a7eacb5aab4ed9e4fc16cc37aab2fc1633ce8ca77e0d0665a76e34a4e6cd2639"
    license: MPL-2.0
    boundary: TARGET
    architecture: aarch64
    linkage: shared
    patches: []
    cmake:
      options:
        # Boost dev（头文件 + 未带版本号 .so 软链 + libboost_system stub）已由
        # orin-r35.3.1 sysroot 提供（Ubuntu focal libboost1.71-dev 1.71.0-6ubuntu6，
        # 与 sysroot 运行时 Boost 1.71.0 同版本），find_package(Boost) 可解析。
        # GTEST_ROOT=n/a：3.4.10 在未设 GTEST_ROOT 时会 FetchContent 联网 clone
        # googletest（违反离线受控构建）；设为 "n/a" 后顶层跳过 FetchContent，
        # 且 test/CMakeLists.txt 对 "n/a" 直接 return()，干净跳过测试、全程不联网。
        GTEST_ROOT: "n/a"
        ENABLE_TEST: "OFF"
        ENABLE_EXAMPLES: "OFF"

  commonapi-core:
    version: "3.2.3-r7"
    source:
      url: "https://github.com/COVESA/capicxx-core-runtime/archive/refs/tags/3.2.3-r7.tar.gz"
      sha256: "07386f8b4f32a9306328fbc9363d6703a798de50b064d7d87f92eef3c4eafdb4"
    license: MPL-2.0
    boundary: TARGET
    architecture: aarch64
    linkage: shared
    patches: []
    # capicxx-core-runtime 3.2.3-r7 使用 CMake（顶层 CMakeLists.txt + cmake/），
    # 由通用 recipe executor（dependency.py）直接构建；源码须预置于
    # dependencies/cache/commonapi-core/（release 不做在线下载）。

  commonapi-someip:
    version: "3.2.3-r8"
    source:
      url: "https://github.com/COVESA/capicxx-someip-runtime/archive/refs/tags/3.2.3-r8.tar.gz"
      sha256: "227b4dfe466ca73391f6092ba01ca32d8c7fd4e149c77b0f12abffe4cd2d788e"
    license: MPL-2.0
    boundary: TARGET
    architecture: aarch64
    linkage: shared
    patches: []
    # CMake 构建（顶层 CMakeLists.txt，同 commonapi-core）；需 vsomeip 与 core
    # runtime 先行进入 staging 并暴露 pkg-config/.pc。

  # ================================================================
  # Protocol Buffers（TBOX-TSP-DSN-CR-009 / TBOX-SOMEIP-DSN-CR-008）
  #   TSP 与 SOMEIP 都自备 proto 并经 pkg_check_modules(protobuf) 消费
  #   TARGET runtime。此前 protobuf 未登记，两者的 configure 在受控容器内
  #   直接失败（"No package 'protobuf' found"）。
  #
  #   版本选择 3.21.12（release v21.12）的原因链：
  #    (1) 两个服务的 proto 均为 proto3 且使用 field presence（optional），
  #        需 protoc >= 3.15；SOMEIP 不传 --experimental_allow_proto3_optional，
  #        TSP 传该 flag —— 3.21.12 同时满足（实测两条 protoc 命令均通过）。
  #    (2) 3.21.12 是引入 abseil 硬依赖（22.x）之前的最后一条 C++ 线，
  #        仅需 C++14，适配容器 gcc-9 与 CMake 3.16。
  #    (3) 生成代码的版本门禁为 #if PROTOBUF_VERSION < 3021000，
  #        故 TARGET runtime 必须是 3.21.x，与 HOST protoc 同版本。
  #
  #   linkage=static 的原因：Orin sysroot 只带 runtime libprotobuf.so.17
  #   （= 3.6.1，无 dev 头/软链/.pc，无法解析），且 3.6.1 runtime 无法承载
  #   3.21 生成代码。静态链接避免与设备既有 libprotobuf.so.17 SONAME 冲突，
  #   与 curl 的处置同理。
  #
  #   protoc 二进制不由本 recipe 产出（protobuf_BUILD_PROTOC_BINARIES=OFF）：
  #   protoc 是 HOST 工具，由 ci/Dockerfile 以固定 sha256 的官方 release
  #   提供（find_program 在 toolchain 下走 CMAKE_FIND_ROOT_PATH_MODE_PROGRAM
  #   = NEVER，即宿主 PATH），与 CommonAPI generator 的 HOST 定位一致。
  # ================================================================
  protobuf:
    version: "3.21.12"
    source:
      url: "https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protobuf-cpp-3.21.12.tar.gz"
      sha256: "4eab9b524aa5913c6fffb20b2a8abf5ef7f95a80bc0701f3a6dbb4c607f73460"
    license: BSD-3-Clause
    boundary: TARGET
    architecture: aarch64
    linkage: static
    patches: []
    cmake:
      options:
        protobuf_BUILD_TESTS: "OFF"
        protobuf_BUILD_EXAMPLES: "OFF"
        protobuf_BUILD_SHARED_LIBS: "OFF"
        # HOST protoc 来自 ci/Dockerfile；本 recipe 只产出 TARGET runtime。
        protobuf_BUILD_PROTOC_BINARIES: "OFF"
        protobuf_BUILD_LIBPROTOC: "OFF"
        # zlib 仅用于 Gzip*Stream，TSP/SOMEIP 未使用；关闭以免依赖 sysroot
        # 的 zlib dev（sysroot 同样只含 runtime）。
        protobuf_WITH_ZLIB: "OFF"
        # libprotobuf.a 会被链进 someip_proto / tsp_proto 等 PIC 静态库，
        # 必须以 -fPIC 编译，否则下游共享目标链接失败。
        CMAKE_POSITION_INDEPENDENT_CODE: "ON"

cache:
  key_components:
    - platform_manifest_digest
    - toolchain_version
    - sysroot_digest
    - dependency_lock_digest
    - build_type
  directory: dependencies/cache/
